name: 2-render-and-publish
# Runs when Claude pushes metadata (queue/ready), plus a safety run at :55 IST
# every hour 1-6 AM that renders anything Claude didn't get to (template text).
on:
  push:
    paths: ["queue/ready/**"]
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside campaign hours (testing)"
        type: boolean
        default: false
      render_now:
        description: "TEST: render queued clips immediately with template text"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          # retry: a stuck mirror once froze this step for 12+ minutes
          for i in 1 2 3; do
            timeout 300 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q -r requirements.txt' && break
            echo "install attempt $i failed or timed out"; sleep 5
          done
      - name: Render & publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
          RENDER_NOW: ${{ inputs.render_now && '1' || '0' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python clipper/render.py
      - name: Save queue
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "clip-bot@users.noreply.github.com"
          mkdir -p queue state; git add -A queue state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "render: published clips $(date -u +%H:%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*4)); done
