name: 3-replace-clip-video
on:
  workflow_dispatch:
    inputs:
      args:
        description: "OLD_TAG OLD_ASSET NEW_TAG NEW_NAME (groups of 4)"
        required: true
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python tools/replace_from_old.py ${{ inputs.args }}
