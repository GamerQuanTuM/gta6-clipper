# ── GTA VI launch-week clipper ─────────────────────────────────────────────
# Edit this file from the GitHub app (pencil icon) to change anything.

campaign:
  start_date_ist: 2026-11-19   # first night (1 AM IST, 19 Nov)
  end_date_ist: 2026-12-02     # last night (GTA week + one more week of any game)
  start_hour_ist: 1            # runs only between these hours (IST)
  end_hour_ist: 7

# Which game to clip, by date (IST). Empty keywords = ANY game.
# To switch games, change/add a phase here (or ask Claude in chat to do it).
game_phases:
  - name: GTA VI launch week
    label: GTA 6              # name used in titles/hooks
    until_date_ist: 2026-11-25
    keywords: ["grand theft auto vi", "grand theft auto 6", "gta vi", "gta 6", "gta6", "gtavi"]
  - name: Any game (creators' choice)
    until_date_ist: 2026-12-02
    keywords: []

# Streamers to watch. Prefer creators who allow clip channels.
# Usernames exactly as in the URL (twitch.tv/<name>, kick.com/<name>).
# English-speaking creators from anywhere (US, Canada, UK, Ireland, Australia, ...).
# Usernames exactly as in the URL. Unknown names are skipped harmlessly.
# Claude adds more each night after checking they exist. Twitch/Kick only
# (YouTube blocks cloud downloads).
streamers:
  twitch: [kaicenat, jynxzi, xqc, summit1g, caseoh_, sodapoppin, lirik, zackrawrr, timthetatman, shroud,
           pokimane, asmongold, esfandtv, hasanabi, plaqueboymax, tommyinnit, wilbursoot, georgenotfound, caedrel]
  kick: [adinross, trainwreckstv, n3on, stevewilldoit, sneako, amouranth]

finder:
  lookback_minutes: 70        # how much of each stream to scan per run
  max_vod_age_hours: 8        # ignore streams that ended longer ago
  clips_per_streamer: 3       # per run
  clips_per_run: 9            # total per hourly run (Claude rejects ~40%, so ~5 publish per hour)
  max_clips_per_night: 25     # stop finding once this many are published tonight
  min_words: 8                # skip moments where the streamer barely speaks (game audio / cutscenes)
  min_score: 2.2              # higher = only bigger reactions
  min_gap_seconds: 120        # keep picked moments this far apart
  allowed_languages: [en]     # skip clips where the streamer speaks another language
  chat_delay_seconds: 6       # chat reacts ~6s after the moment happens
  use_chat: false             # Twitch chat reader is currently broken; audio spikes only
  min_score_audio_only: 1.6   # threshold when chat isn't used
  download_timeout: 150       # seconds before giving up on one streamer's audio download
  run_budget_minutes: 36      # stop starting new streamers after this long

clip:
  min_seconds: 30
  max_seconds: 57             # + ~2s hook teaser = under 60s
  before_moment: 32           # seconds kept before the peak moment
  after_moment: 13            # seconds kept after it
  teaser_seconds: 2.0         # the hook: best moment flashed first
  fps: 60                     # output frame rate (1080x1920)
  facecam_mode: "off"   # off = webcam cut out, gameplay big and centred | split = webcam panel on top
  facecam_ai: false           # Real-ESRGAN upscaling of the webcam (CPU, ~6-7 min per clip)
  facecam_ai_fps: 12          # webcam panel frame rate when AI-upscaled
  facecam_ai_budget_seconds: 420   # per clip; if too slow it falls back to normal upscaling
  facecam_ai_max_per_run: 2   # AI only for the best N clips per render run (rest use normal upscaling)
  facecam_split: true         # facecam on top, gameplay below (auto-detected face overlay)
  zoom: 1.0                   # used only when no facecam: 1.0 = whole frame (nothing cut off)
  whisper_model: small        # tiny / base / small (small = best captions on CPU)

publish:
  github_release: true        # MP4 + copy-paste text in a GitHub Release (phone friendly)
  youtube_api_upload: false   # only turn on after your Google API project passes the audit
  youtube_privacy: public
  max_youtube_uploads_per_night: 6
  fallback_after_minutes: 150 # only if Claude missed 2 hourly reviews: render with template text
