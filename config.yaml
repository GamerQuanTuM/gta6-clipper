# ── GTA VI launch-week clipper ─────────────────────────────────────────────
# Edit this file from the GitHub app (pencil icon) to change anything.

campaign:
  start_date_ist: 2026-11-19   # first night (1 AM IST, 19 Nov)
  end_date_ist: 2026-11-25     # last night  -> 7 nights total
  start_hour_ist: 1            # runs only between these hours (IST)
  end_hour_ist: 7

# Only clip streams whose title / category / chapters mention one of these.
game_keywords: ["grand theft auto vi", "grand theft auto 6", "gta vi", "gta 6", "gta6", "gtavi"]

# Streamers to watch. Prefer creators who allow clip channels.
# Usernames exactly as in the URL (twitch.tv/<name>, kick.com/<name>).
streamers:
  twitch: [kaicenat, xqc, summit1g, caseoh_, sodapoppin, lirik, zackrawrr, jynxzi, timthetatman, shroud]
  kick: [adinross, xqc, trainwreckstv]

finder:
  lookback_minutes: 70        # how much of each stream to scan per run
  max_vod_age_hours: 8        # ignore streams that ended longer ago
  clips_per_streamer: 2       # per run
  clips_per_run: 5            # total per hourly run (across all streamers)
  min_score: 2.2              # higher = only bigger reactions
  min_gap_seconds: 120        # keep picked moments this far apart
  chat_delay_seconds: 6       # chat reacts ~6s after the moment happens

clip:
  min_seconds: 30
  max_seconds: 57             # + ~2s hook teaser = under 60s
  before_moment: 32           # seconds kept before the peak moment
  after_moment: 13            # seconds kept after it
  teaser_seconds: 2.0         # the hook: best moment flashed first
  zoom: 1.45                  # 1.0 = whole frame, higher = tighter centre crop
  whisper_model: small        # tiny / base / small (small = best captions on CPU)

publish:
  github_release: true        # MP4 + copy-paste text in a GitHub Release (phone friendly)
  youtube_api_upload: false   # only turn on after your Google API project passes the audit
  youtube_privacy: public
  max_youtube_uploads_per_night: 6
  fallback_after_minutes: 40  # if Claude hasn't written metadata by then, use a template
