         8bitheadflicker, rakazone, soulaman, anshyt, binks69, xqc, theburntpeanut]
  youtube: [GamerFleet, LiveInsaan, CarryisLive, TechnoGamerzOfficial, PAYALGAMING, RakaZoneGaming,
            SnaxGaming, DynamoGaming, JokerKiHaveli, TotalGaming093, MythPat, SHARKSHE,
